services:
  - type: worker
    name: agentic-builder-bot
    env: python
    buildCommand: pip install -e .
    startCommand: python src/main.py --mode telegram
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_TELEGRAM_USERS
        sync: false
      - key: MODEL
        value: gemini-2.5-flash-lite
      - key: RENDER_DEPLOYMENT_ENABLED
        value: "true"
