[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-builder"
version = "1.0.0"
description = "Template project for ReAct dynamic agents with dynamic skills in Python"
readme = "README.md"
authors = [{ name = "Antigravity" }]
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "google-genai>=1.0.0",
    "openai>=1.12.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "python-dotenv>=1.0.1",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
agentic-builder = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "config*"]
