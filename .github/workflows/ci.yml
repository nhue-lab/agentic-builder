name: Guardrails CI

on:
  push:
    branches: [ "dev-agent" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Check for secrets and format with Ruff
      run: |
        ruff check .

    - name: Run unit tests
      run: |
        pytest
